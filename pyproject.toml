[project]
name = "dictee"
version = "0.1.0"
description = "Dictée vocale locale (FR/EN) sur CPU avec Parakeet ou Whisper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "gradio>=6.30.0",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "soxr>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["."]
markers = ["slow: downloads models and runs real transcription (run with -m slow)"]
